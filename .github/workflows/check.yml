name: Checks

on:
  # Every file the check job lints, typechecks, tests, builds or packs, so a
  # PR touching only one of them still gets the required check
  push:
    branches: ['main']
    paths: &paths
      - '.github/**'
      - '.githooks/**'
      - 'src/**'
      - 'scripts/**'
      - '**/*.md'
      - 'package.json'
      - 'package-lock.json'
      - 'rollup.config.js'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
      - 'typedoc.json'
      - 'custom-typedoc-plugin.js'
      - 'eslint.config.mjs'
      - '.prettierrc'
  pull_request:
    branches: ['main']
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Lint # Code and Markdown, with Prettier
        run: npm run style:lint
      - name: Typecheck # Source and tests
        run: npm run typecheck
      - name: Test # With coverage thresholds
        run: npm run test:ci
      - name: Build
        run: npm run build
      - name: Check package # Packs, installs and imports the package from every entry point
        run: npm run check:pack
      - name: Check API docs
        run: npm run docs:check
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: phun-ky/angle
          files: coverage/cobertura-coverage.xml

  notify:
    name: Notify failed check
    needs: check
    if: failure()
    runs-on: ubuntu-24.04
    steps:
      - uses: drivendataorg/failed-build-issue-action@940568ce50eeef3f31a920614cefcc6102d2f930 # v1.3.0
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          label-name: 'problems: 💔 build failed'
          create-label: false
